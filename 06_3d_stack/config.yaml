required_feast_provenance_sha256: "9fbe12912ab0853d9c637ef0651b55157af2f015e90187947619d7936e42e898"

dataset:
  artifact_id: "Allen_Zhuang_ABCA_1_processed_h5ad"
  filename_prefix: "Zhuang-ABCA-1"
  first_slice: 1
  last_slice: 150
  intentionally_absent_slices: [75, 94, 112]
  expected_files: 147
  expected_genes: 1122
  label_key: "class"
  z_key: "z"
  spatial_key: "spatial"
  spatial_3d_key: "spatial_3d"
  counts_layer: "counts"

densities:
  - name: "dense_gap3"
    gap: 3
    radius: 1
    start: 5
    expected_targets: 49
    expected_references: 95
    expected_assignment_randomness: 0.35
  - name: "medium_gap5"
    gap: 5
    radius: 2
    start: 6
    expected_targets: 29
    expected_references: 57
    expected_assignment_randomness: 0.30
  - name: "sparse_gap10"
    gap: 10
    radius: 5
    start: 6
    expected_targets: 15
    expected_references: 16
    expected_assignment_randomness: 0.35

assignment_randomness_preflight:
  estimator: "FEAST.estimate_assignment_randomness"
  representative_reference_slices: 3
  n_genes: 20
  step: 0.05
  maximum: 0.5
  spatial_neighbors: 6
  agreement_tolerance: 1.0e-12
  seed_formula: "public_seed + gap * 1000 + representative_index"
  transport_backend: "torch"
  transport_device: "cpu"
  transport_dtype: "float64"

reference_fit:
  # Zero preserves the declared complete 1,122-gene panel even when one
  # bracket happens to contain an all-zero gene.
  min_gene_spots: 0
  min_gene_mean: 0.0
  max_gene_zero_prop: 1.0
  boundary_neighbors: 6
  coordinate_scale: null

generation:
  public_api: "FEAST.de_novo.fit_reference + FEAST.de_novo.simulate_from_reference"
  condition_on: "class"
  marginal_model: "empirical_reference"
  target_expression_access: "evaluation_only"
  target_observed_fields: ["obs_names", "class", "z", "spatial", "spatial_3d", "var_names"]
  seed_formula: "public_seed + gap * 10000 + target_index"
  reference_weight_formula: ["1 - tau", "tau"]
  donor_support_scope: "full density-specific reference pool"
  donor_selection: "nearest adjusted z, then lowest slice id"
  smoothing: false
  z_regularization: false
  assignment_randomness_source: "frozen preflight"
  diffusion_level: 0.0
  boundary_softness: 0.0
  boundary_multiplier: 1.1
  reference_weight_eta: 4.0
  quantile_field_mode: "auto"
  rank_scope: "auto"
  target_parameter_mode: "reference_weighted_log"
  tie_policy: "stable_ordinal"
  tie_jitter_scale: 1.0e-9
  min_rank_scope_size: 20
  store_latent_scores: false
  store_quantiles: false
  reference_conflict_policy: "average"

transport:
  epsilon: 0.05
  sinkhorn_iter: 1000
  sinkhorn_tol: 1.0e-5
  unbalanced_transport: true
  reg_m: 5.0
  transport_nonconvergence: "raise"
  sinkhorn_method: "sinkhorn_log"
  transport_backend: "torch"
  transport_device: "cuda:0"
  transport_dtype: "float64"
  geometry_weight: 1.0
  boundary_weight: 0.25
  latent_clip_eps: 1.0e-6
  gene_chunk_size: 512
  max_transport_pairs: 25000000

validation:
  coordinate_atol: 1.0e-8
  expected_outputs: 93
  require_positive_transport_convergence: true
  require_output_hash: true
  require_exact_target_identity: true
  require_declared_donor_support: true
  prohibit_target_expression_during_generation: true

evaluation:
  unit: "class-gene trajectory across ordered z levels within each density"
  targets_are_biological_replicates: false
  inferential_statistics_across_targets: "prohibited"
  real_continuity_baseline:
    method: "deterministic within-slice within-class split-half means, correlated across z"
    seed_formula: "public_seed + target_slice"
    minimum_class_spots: 2
    minimum_z_levels: 3
  normalized_z_coherence: "median generated-vs-target z coherence / median real split-half z coherence"
  composite_score: "prohibited"

historical_comparison:
  artifact_id: "legacy-study05-cross-density-summary-pre-unified-ot"
  expected_sha256: "639b298ed6d093dda24417f1fa04a813557aaab217e338a3ffab9c54456e1b25"
  status: "historical_noncanonical_comparison_only"
  historical_sinkhorn_iter: 200
  fresh_sinkhorn_iter: 1000

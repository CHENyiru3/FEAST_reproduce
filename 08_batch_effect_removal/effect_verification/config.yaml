# FEAST Batch Effect Assessment Configuration
# ============================================
# Characterises slice-to-slice distributional differences in
# FEAST parameter-cloud space: (log_mu, log_omega, logit_pi0).

# Slices to analyse (spatialLIBD DLPFC Visium sample IDs)
slices:
  - "151507"
  - "151508"
  - "151509"
  - "151510"
  - "151669"
  - "151670"
  - "151671"
  - "151672"
  - "151673"
  - "151674"
  - "151675"
  - "151676"

# Reference slice for shift / affine computation
reference_slice: "151508"

# Gene filtering
gene_filter:
  min_mean: 0.01
  min_spots_detected: 10
  common_genes_only: true

# Distance metrics to compute between parameter clouds
distance_metrics:
  - centroid_euclidean
  - covariance_frobenius
  - covariance_riemannian
  - mmd_rbf
  - sliced_wasserstein

# Sliced Wasserstein approximation quality
sliced_wasserstein_n_projections: 200

# MMD RBF kernel bandwidth (null = auto from median distance)
mmd_gamma: null

# Domain label key in adata.obs  (cortical layers for DLPFC)
domain_key: "dlpfc_layer"

# Output directory (timestamped subdirectory created within)
output_dir: "outputs"

# Random seed for reproducibility
random_seed: 42

# Data directory
data_dir: "/maiziezhou_lab2/yiru/Datasets/Processed/spatialLIBD_DLPFC_Visium/h5ad"

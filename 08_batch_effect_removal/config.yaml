# Batch Effect Correction Benchmark Configuration
# =================================================
# Benchmarks GraphST, scVI, and STAMP on FEAST-simulated batch effects.

# Simulation data (generated by effect_simulation/run_simulation.py)
simulation:
  manifest_dir: "effect_simulation/outputs"
  data_dir: "/maiziezhou_lab2/yiru/Datasets/Processed/spatialLIBD_DLPFC_Visium/h5ad"
  reference_slice: "151673"

# Deformation modes to benchmark
deformation_modes:
  - shift_only
  - diagonal_affine

# Alpha levels to benchmark (0.0 = reference, >0.0 = batch-affected)
alpha_levels: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]

# Methods configuration
methods:
  GraphST:
    env: "/maiziezhou_lab2/yiru/envs/GraphST"
    script: "methods/graphst_batch.py"
    kwargs:
      n_hvgs: 2000
      epochs: 600
      device: "cuda"

  scVI:
    env: "/maiziezhou_lab2/yiru/miniconda3/envs/scvi-tools"
    script: "methods/scvi_batch.py"
    kwargs:
      n_hvgs: 2000
      n_latent: 10
      n_layers: 1
      n_hidden: 128
      dropout_rate: 0.1
      max_epochs: 400

  STAMP:
    env: "/maiziezhou_lab2/yiru/miniconda3/envs/sctm"
    script: "methods/stamp_batch.py"
    kwargs:
      n_topics: 10
      n_hvgs: 2000
      n_layers: 1
      hidden_size: 128
      mode: "sgc"

# Benchmark metrics
metrics:
  # Batch mixing
  - kbet_acceptance
  - silhouette_batch
  - batch_mixing_entropy
  # Biological preservation
  - silhouette_domain
  - domain_ari
  # Expression preservation
  - expression_correlation
  # Parameter cloud metrics
  - centroid_shift
  - covariance_distance
  - mmd_rbf

# Output
output_dir: "outputs"
random_seed: 42

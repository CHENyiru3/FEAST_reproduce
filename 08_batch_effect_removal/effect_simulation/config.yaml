# Batch Effect Controllable Simulation Configuration
# ==================================================
# Reference slice is paired with a query (batch-affected) slice.
# FEAST.characterize_batch() estimates D/b via OLS in theta space.
# Modes:
#   diagonal_affine — full (D, b) from OLS
#   shift_only      — same b, but D = [1, 1, 1] (centroid shift only)

# Clean reference slice
reference_slice: "151673"

# Batch-affected query slice (used to estimate D, b via characterize_batch)
query_slice: "151508"

# Which deformation modes to simulate
modes:
  - shift_only
  - diagonal_affine

# Batch severity ladder
alpha_levels: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]

# Output
output_dir: "outputs"
random_seed: 42

# Data
data_dir: "/maiziezhou_lab2/yiru/Datasets/Processed/spatialLIBD_DLPFC_Visium/h5ad"

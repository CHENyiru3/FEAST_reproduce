# Alignment simulation configuration (v2)
# Reference = raw Visium data. Moving = FEAST-simulated with mild alterations,
# then rotated. Tests alignment under expression perturbation.
# Last updated: 2026-06-15

input: "data/151675.h5ad"
seed: 2026
angles: [1, 5, 10, 30, 45, 60]
data_type: "sequencing"

simulation:
  parameter_mode: "hungarian"
  spatial_mode: "reference_rank"
  min_cells: 30
  verbose: true

alterations:
  - id: baseline
    type: baseline
    fold_change: 1.0
  - id: mean_0.5
    type: mean
    fold_change: 0.5
  - id: variance_2.0
    type: variance
    fold_change: 2.0
  - id: sparsity_0.5
    type: sparsity_logit_shift
    fold_change: 0.5
    logit_shift: -0.6931471805599453

transformation:
  center_correction: 0
  keep_bounds: true

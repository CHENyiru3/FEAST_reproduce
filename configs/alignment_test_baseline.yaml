# Test config: baseline only, sequencing data_type (fix test)
input: "data/151675.h5ad"
seed: 2026
angles: [1, 5, 10, 30, 45, 60]
data_type: "sequencing"

simulation:
  parameter_mode: "hungarian"
  spatial_mode: "reference_rank"
  min_cells: 30
  verbose: true

alterations:
  - id: baseline
    type: baseline
    fold_change: 1.0

transformation:
  center_correction: 0
  keep_bounds: true
